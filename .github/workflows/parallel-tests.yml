name: Parallel Test Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    # Daily at 05:00 Israel time (in addition to push/PR runs). GitHub cron is UTC-only and
    # can't track Israel DST (IST = UTC+2 winter, IDT = UTC+3 summer), so BOTH candidate UTC
    # slots are scheduled and the `gate` job lets through only the one that is 05:xx in
    # Asia/Jerusalem right now:  02:00 UTC = 05:00 IDT (summer)   03:00 UTC = 05:00 IST (winter)
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'

concurrency:
  group: parallel-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # DST-aware schedule gate. On push/PR/dispatch it always proceeds; on the scheduled runs
  # (two UTC crons) it lets through only the one that is currently the 05:xx hour in
  # Asia/Jerusalem — i.e. 05:00 Israel time year-round. Checking the hour (not the exact
  # minute) tolerates GitHub's usual few-minutes cron delay.
  gate:
    name: Schedule gate (05:00 Asia/Jerusalem)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Non-scheduled (${{ github.event_name }}) run — proceeding."
            exit 0
          fi
          HOUR=$(TZ='Asia/Jerusalem' date +%H)
          echo "Current Asia/Jerusalem time: $(TZ='Asia/Jerusalem' date '+%Y-%m-%d %H:%M %Z')"
          if [ "$HOUR" = "05" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "It is the 05:xx hour in Israel — correct DST-adjusted slot; proceeding."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the 05:xx hour in Israel — the other cron slot covers the current DST offset; skipping."
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

  tests:
    name: Playwright ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project:
          # chromium and product-authenticated stay commented out because those projects
          # are DISABLED in playwright.config.ts (their spec files are kept). Re-enable a
          # shard in the SAME change that uncomments its config block — otherwise a shard
          # names a project that no longer resolves and the job errors.
          # (product-authenticated pulls in product-setup as its dependency, so setup runs
          # within that shard — no separate product-setup shard needed.)
          # - chromium
          - organuz-api
          - agent
          - security
          - fraud
          - product
          - accessibility
          # - product-authenticated

    env:
      CI: true
      PLAYWRIGHT_MERGE_REPORTS: false
      # The product token-sanity spec opens the dev calculator (dev1.app.organize.organuz.com)
      # to extract the UI token, so it needs the dev password-gate secret; the marketing-site
      # (chromium), Supabase (organuz-api), and agent (stubs) projects ignore it.
      QA_TARGET_ENV: dev
      PRODUCT_PLATFORM_PASSWORD: ${{ secrets.PRODUCT_PLATFORM_PASSWORD }}
      # Per-role phone/OTP for the live product-authenticated specs. When a secret is
      # unset the product-setup project skips that role and its specs skip too (green).
      CUSTOMER_PHONE: ${{ secrets.CUSTOMER_PHONE }}
      CUSTOMER_OTP_CODE: ${{ secrets.CUSTOMER_OTP_CODE }}
      CONSULTANT_PHONE: ${{ secrets.CONSULTANT_PHONE }}
      CONSULTANT_OTP_CODE: ${{ secrets.CONSULTANT_OTP_CODE }}
      COMPANY_PHONE: ${{ secrets.COMPANY_PHONE }}
      COMPANY_OTP_CODE: ${{ secrets.COMPANY_OTP_CODE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # chromium/accessibility drive the marketing site; product opens a chromium context to
        # extract the UI token; product-authenticated (+ its product-setup dependency)
        # drive the dev calculator. The organuz-api and agent projects need no browser.
        if: matrix.project == 'chromium' || matrix.project == 'accessibility' || matrix.project == 'product' || matrix.project == 'product-authenticated'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright project
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload blob report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 14

  services-smoke:
    name: FastAPI, Scalar, Prometheus, Grafana
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start service stack
        run: docker compose up -d --build api swagger prometheus grafana pushgateway

      - name: Wait for service endpoints
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null \
              && curl -fsS http://localhost:8080 >/dev/null \
              && curl -fsS http://localhost:9092/-/ready >/dev/null \
              && curl -fsS http://localhost:9091/-/ready >/dev/null \
              && curl -fsS http://localhost:3001/api/health >/dev/null; then
              echo "Service stack is ready."
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs api swagger prometheus grafana pushgateway
          exit 1

      - name: Add service links to summary
        if: always()
        run: |
          {
            echo "## Runtime Servers"
            echo
            echo "These are in-runner ports, reachable only from inside this ephemeral job while it runs — not clickable from your browser. Rendered as code, not links, on purpose."
            echo
            echo "| Server | In-runner port |"
            echo "| --- | --- |"
            echo "| FastAPI | \`localhost:8000\` |"
            echo "| Scalar | \`localhost:8080\` |"
            echo "| Grafana | \`localhost:3001\` |"
            echo "| Prometheus | \`localhost:9092\` |"
            echo "| Pushgateway | \`localhost:9091\` |"
            echo "| Allure | Published by the report job to GitHub Pages and uploaded as an artifact |"
            echo
            echo "For externally reachable links in the final summary, set the \`FASTAPI_URL\`, \`SWAGGER_URL\`, and \`GRAFANA_URL\` repository variables."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload service logs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p service-logs
          docker compose logs api swagger prometheus grafana pushgateway > service-logs/docker-compose-services.log

      - name: Store service logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: service-logs/
          if-no-files-found: ignore
          retention-days: 14

  # Live Govmap + Ofek availability monitoring, run by default on every push/PR.
  # continue-on-error keeps it NON-BLOCKING: a map-dependency outage shows this
  # job red (and still alerts via the separate monitoring.yml cron) but never
  # fails the code pipeline / green PR gate. APIRequestContext only — no browser.
  monitoring:
    name: Govmap + Ofek monitoring
    runs-on: ubuntu-latest
    needs: typecheck
    continue-on-error: true
    timeout-minutes: 10
    env:
      MONITORING_ENABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Govmap + Ofek monitoring
        run: npx playwright test --project=monitoring

      - name: Upload Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-monitoring
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload blob report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-monitoring
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 14

  publish-allure:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs:
      - gate
      - typecheck
      - tests
      - monitoring
    # Publish regardless of test pass/fail, but not on a scheduled run the gate skipped
    # (else deploy-allure would push an empty report over the real one on GitHub Pages).
    if: always() && needs.gate.outputs.run == 'true'
    timeout-minutes: 15
    env:
      GRAFANA_URL: ${{ vars.GRAFANA_URL || 'http://localhost:3001' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure result artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: collected-allure-results
          merge-multiple: true

      # Restore the previous run's Allure history (Trend / Retries / History graphs).
      # A unique key per run + the `allure-history-` restore-keys prefix makes this a
      # ROLLING cache: each run saves a new entry and restores the most recent prior one.
      - name: Restore Allure history
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      - name: Generate Allure report
        run: |
          # Seed this run's results with the restored history so the generated report
          # keeps its Trend / Retries / History across runs (else it resets each time).
          if [ -d allure-history ] && [ -n "$(ls -A allure-history 2>/dev/null)" ]; then
            mkdir -p collected-allure-results/history
            cp -R allure-history/. collected-allure-results/history/
            echo "Seeded Allure history from the rolling cache."
          fi
          if find collected-allure-results -type f -print -quit 2>/dev/null | grep -q .; then
            npx -y -p allure@3 allure generate collected-allure-results --output allure-report
          else
            mkdir -p allure-report
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="en">' \
              '<head>' \
              '  <meta charset="utf-8">' \
              '  <title>Allure Report</title>' \
              '</head>' \
              '<body>' \
              '  <h1>No Allure results were produced</h1>' \
              '  <p>The workflow completed without downloadable Allure result artifacts.</p>' \
              '</body>' \
              '</html>' \
              > allure-report/index.html
          fi
          # Capture the freshly-generated history for the NEXT run's cache.
          rm -rf allure-history
          if [ -d allure-report/history ]; then
            mkdir -p allure-history
            cp -R allure-report/history/. allure-history/
          fi
          # GitHub Pages hardening for the Allure SPA:
          #  - .nojekyll stops Pages' Jekyll step from dropping files (Allure ships
          #    hashed asset bundles and a data/ dir that Jekyll can mangle).
          #  - 404.html mirrors index.html so a deep link / hard refresh into a
          #    client-side route resolves to the app instead of a Pages 404.
          touch allure-report/.nojekyll
          cp allure-report/index.html allure-report/404.html

      # Persist this run's history under a unique key for the next run to restore.
      - name: Save Allure history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}

      - name: Upload generated Allure report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          include-hidden-files: true  # carry .nojekyll through to the deploy job
          if-no-files-found: error
          retention-days: 14

  deploy-allure:
    name: Deploy Allure Report
    runs-on: ubuntu-latest
    needs:
      - gate
      - publish-allure
    # Deploy to Pages even when an upstream job errored — a failing test shard, or even
    # publish-allure itself, must not block publishing the report (it is the artifact of
    # the run regardless of pass/fail). `always()` overrides the default "skip if a needed
    # job failed"; still guarded to real pushes on the default branch and to non-gated
    # (scheduled-skip) runs, and a fallback step below guarantees there is always a report
    # to publish even if the artifact never arrived.
    if: always() && needs.gate.outputs.run == 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deploy-pages.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Download generated Allure report
        uses: actions/download-artifact@v4
        continue-on-error: true # publish-allure may have errored before uploading; fallback below
        with:
          name: allure-report
          path: allure-report

      - name: Ensure a report exists to deploy
        run: |
          # Guarantee a non-empty site so the Pages upload/deploy never fails, even when
          # publish-allure errored and produced no allure-report artifact to download.
          mkdir -p allure-report
          if [ ! -f allure-report/index.html ]; then
            printf '%s\n' \
              '<!doctype html>' \
              '<html lang="en"><head><meta charset="utf-8"><title>Allure Report</title></head>' \
              '<body><h1>No Allure report was produced for this run</h1>' \
              '<p>An upstream job failed before the report could be generated.</p></body></html>' \
              > allure-report/index.html
          fi
          touch allure-report/.nojekyll
          cp allure-report/index.html allure-report/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Deploy Allure report to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

  report-summary:
    name: Report Summary
    runs-on: ubuntu-latest
    needs:
      - gate
      - publish-allure
      - deploy-allure
      - services-smoke
    if: always() && needs.gate.outputs.run == 'true'
    env:
      # External URLs only when a repository variable points at a hosted deployment.
      # Unset => empty => rendered as inline code, because the in-runner localhost
      # ports are not reachable from a browser and must not appear as broken links.
      FASTAPI_URL: ${{ vars.FASTAPI_URL }}
      SWAGGER_URL: ${{ vars.SWAGGER_URL }}
      GRAFANA_URL: ${{ vars.GRAFANA_URL }}
      PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL }}
      DEPLOYED_URL: ${{ needs.deploy-allure.outputs.page_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Add report links to summary
        if: always()
        run: |
          # A cell is a real markdown link when an external URL is configured,
          # otherwise inline code labelled with the in-runner port (not clickable).
          cell() { if [ -n "$1" ]; then printf '[%s](%s)' "$1" "$1"; else printf '`%s`' "$2"; fi; }

          # Allure: link the deployed Pages report when this run published it (push to
          # main/master). Otherwise link the run's artifacts, where the allure-report is
          # always uploaded — on pull requests the deploy job is intentionally skipped,
          # so the old github.io fallback pointed at a 404/stale page.
          if [ -n "$DEPLOYED_URL" ]; then
            ALLURE_CELL="[Open report]($DEPLOYED_URL)"
          else
            ALLURE_CELL="not deployed for this run — [download the \`allure-report\` artifact]($RUN_URL)"
          fi

          {
            echo "## Test Automation Reports"
            echo
            echo "| Report | Link |"
            echo "| --- | --- |"
            echo "| Allure 3 report | ${ALLURE_CELL} |"
            echo "| FastAPI server | $(cell "$FASTAPI_URL" 'localhost:8000') |"
            echo "| Scalar API reference | $(cell "$SWAGGER_URL" 'localhost:8080') |"
            echo "| Grafana dashboard | $(cell "$GRAFANA_URL" 'localhost:3001') |"
            echo "| Prometheus | $(cell "$PROMETHEUS_URL" 'localhost:9092') |"
            echo
            echo "The FastAPI / Scalar / Grafana / Prometheus stack is ephemeral — the \`localhost\` ports are only live inside the runner during the services-smoke job. Set the \`FASTAPI_URL\`, \`SWAGGER_URL\`, \`GRAFANA_URL\`, and \`PROMETHEUS_URL\` repository variables to link an externally hosted deployment here instead."
          } >> "$GITHUB_STEP_SUMMARY"

      # Post the report links to Slack once the whole pipeline has finished.
      # Runs on push/dispatch (not PRs) — the GitHub Pages Allure URL only exists
      # after deploy-allure publishes it on main/master. Posts to all configured
      # webhooks (SLACK_WEBHOOK_URL, SLACK_WEBHOOK_BOT_URL, SLACK_ORGANUZ_TESTING_URL);
      # each is optional (unset = skipped) and non-fatal (a bad post never fails
      # the run). Guard lives in the script because secrets can't be used in `if:`.
      - name: Notify Slack with report links
        if: always() && github.event_name != 'pull_request'
        env:
          SLACK_ORGANUZ_TESTING_URL: ${{ secrets.SLACK_ORGANUZ_TESTING_URL }}
          GRAFANA_LINK_URL: ${{ vars.GRAFANA_URL || 'http://localhost:3001' }}
          SWAGGER_LINK_URL: ${{ vars.SWAGGER_URL || 'http://localhost:8080' }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ] && [ -z "$SLACK_WEBHOOK_BOT_URL" ] && [ -z "$SLACK_ORGANUZ_TESTING_URL" ]; then
            echo "No Slack webhook secrets set — skipping report notification."
            exit 0
          fi

          # Allure: the deployed Pages URL when this run published it, else the run's
          # artifacts (where the allure-report is always uploaded).
          if [ -n "$DEPLOYED_URL" ]; then
            ALLURE_LINK="<${DEPLOYED_URL}|Allure report (GitHub Pages)>"
          else
            ALLURE_LINK="<${RUN_URL}|Allure report (download artifact)>"
          fi

          # Playwright HTML report lives in the run's artifacts (uploaded alongside Allure).
          PLAYWRIGHT_LINK="<${RUN_URL}|Playwright HTML report (download artifact)>"
          TEXT=":bar_chart: *Organuz — GitHub Actions test run* finished — <${RUN_URL}|View run>\n• ${ALLURE_LINK}\n• <${GRAFANA_LINK_URL}|Grafana dashboard>\n• ${PLAYWRIGHT_LINK}\n• <${SWAGGER_LINK_URL}|Scalar API docs>"
          PAYLOAD=$(printf '{"text":"%s"}' "$TEXT")

          post() { # $1 = secret name, $2 = url
            if [ -z "$2" ]; then echo "$1 not set — skipping."; return; fi
            if curl -fsS -X POST "$2" -H 'content-type: application/json' --data "$PAYLOAD" >/dev/null; then
              echo "$1: posted."
            else
              echo "$1: post failed (non-fatal)."
            fi
          }
          post SLACK_ORGANUZ_TESTING_URL "$SLACK_ORGANUZ_TESTING_URL"
