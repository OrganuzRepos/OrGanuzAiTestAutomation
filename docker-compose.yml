services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: organuz-ai-fastapi-server
    ports:
      - "8000:8000"
    # No test-results bind mount: QA metrics are now pushed to the Pushgateway by
    # the test runner (scripts/push-qa-metrics.mjs), so the api no longer reads the
    # results file (which is what went stale here on macOS after each run).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  swagger:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./server/scalar:/usr/share/nginx/html:ro

  pushgateway:
    image: prom/pushgateway:v1.10.0
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9092:9090"
    depends_on:
      api:
        condition: service_healthy
      pushgateway:
        condition: service_started
    volumes:
      - ./server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Uncomment when shipping metrics to a hosted Grafana (Grafana Cloud) via the
      # remote_write block in prometheus.yml. The token file is gitignored.
      # - ./server/grafana-cloud-token:/etc/prometheus/grafana-cloud-token:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./server/grafana/provisioning:/etc/grafana/provisioning:ro

  allure:
    image: nginx:1.27-alpine
    ports:
      - "5050:80"
    volumes:
      - ./allure-report:/usr/share/nginx/html:ro
      # no-store on index.html so a regenerated report (new content-hashed
      # bundles) isn't masked by a stale cached entry point -> blank page.
      - ./server/allure-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: organuz-ai-site-tests
    working_dir: /app
    entrypoint: ["bash", "/app/scripts/run-all-tests.sh"]
    depends_on:
      api:
        condition: service_healthy
      swagger:
        condition: service_started
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
    environment:
      CI: "true"
      PLAYWRIGHT_MERGE_REPORTS: "false"
      API_BASE_URL: "http://api:8010"
      SWAGGER_URL: "http://swagger:8080"
      PROMETHEUS_URL: "http://prometheus:9090"
      GRAFANA_URL: "http://grafana:3000"
    volumes:
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
      - ./blob-report:/app/blob-report
